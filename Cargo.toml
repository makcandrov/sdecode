[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
repository = "https://github.com/makcandrov/sdecode"
homepage = "https://github.com/makcandrov/sdecode"
license = "MIT OR Apache-2.0"
keywords = ["evm", "storage", "decode", "layout"]

[workspace]
members = [
    "bin/*",
    "crates/*",
]
default-members = ["crates/sdecode"]

resolver = "3"

[workspace.dependencies]
sdecode-cli = { path = "bin/cli", version = "=0.1" }

sdecode = { path = "crates/sdecode", version = "=0.1" }
sdecode-core = { path = "crates/sdecode-core", version = "=0.1" }
sdecode-inspector = { path = "crates/sdecode-inspector", version = "=0.1" }
sdecode-preimages-caches = { path = "crates/sdecode-preimages-caches", version = "=0.1" }
sdecode-solidity = { path = "crates/sdecode-solidity", version = "=0.1" }
sdecode-solidity-macro = { path = "crates/sdecode-solidity-macro", version = "=0.1" }
sdecode-test-utils = { path = "crates/sdecode-test-utils", version = "=0.1" }

alloy-primitives = { version = "1", default-features = false }
alloy-sol-types = { version = "1", default-features = false }
syn-solidity = "1"

alloy-preimages = { git = "https://github.com/makcandrov/alloy-preimages" }

revm = "39"
revm-bytecode = { version = "11", default-features = false }
revm-inspector = { version = "20", default-features = false }
revm-interpreter = { version = "36", default-features = false }

hashbrown = "0.17"
indexmap = "2"
array-init = "2"

auto_impl = "1"
overf = "0.1"
quick-impl = "0.2"
thiserror = "2"
paste = "1"

serde = "1"
serde_json = "1"

proc-macro2 = "1"
quote = "1"
syn = "2"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
